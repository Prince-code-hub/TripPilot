spring.application.name=TripPilotBackend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/trippilot
spring.datasource.username=trippilot
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8081